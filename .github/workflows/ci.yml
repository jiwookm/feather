name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install runtime tools
        run: brew install tmux ripgrep
      - name: Run release checks
        run: ./scripts/check-release.sh
      - name: Upload arm64 app bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Feather-arm64-${{ github.sha }}
          path: dist/Feather.app
          if-no-files-found: error
          retention-days: 7
