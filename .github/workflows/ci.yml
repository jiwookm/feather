name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64-release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install runtime tools
        run: brew install tmux ripgrep
      - name: Run release checks
        run: ./scripts/check-release.sh
      - name: Upload arm64 app bundle
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: Feather-arm64-${{ github.sha }}
          path: dist/Feather.app
          if-no-files-found: error
          retention-days: 7
