name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FEATHER_RELEASE_VERSION: ${{ github.ref_name }}
      FEATHER_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate release tag
        shell: zsh {0}
        run: |
          set -euo pipefail
          version=${FEATHER_RELEASE_VERSION#v}
          if [[ ! "$version" =~ '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$' ]]; then
              print -u2 "Release tags must look like v0.1.0."
              exit 1
          fi
          source_version=$(/usr/libexec/PlistBuddy \
              -c "Print :CFBundleShortVersionString" \
              Resources/Info.plist)
          if [[ "$source_version" != "$version" ]]; then
              print -u2 "Tag $version does not match Info.plist version $source_version."
              exit 1
          fi
          print "FEATHER_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install runtime tools
        run: brew install tmux ripgrep

      - name: Configure optional Developer ID signing
        id: signing
        shell: zsh {0}
        env:
          SIGNING_CERTIFICATE_P12: ${{ secrets.FEATHER_SIGNING_CERTIFICATE_P12 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.FEATHER_SIGNING_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_P8: ${{ secrets.FEATHER_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.FEATHER_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.FEATHER_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          configured_secret_count=0
          for secret in \
              "$SIGNING_CERTIFICATE_P12" \
              "$SIGNING_CERTIFICATE_PASSWORD" \
              "$NOTARY_KEY_P8" \
              "$NOTARY_KEY_ID" \
              "$NOTARY_ISSUER_ID"; do
              [[ -n "$secret" ]] && (( configured_secret_count += 1 ))
          done
          if (( configured_secret_count == 0 )); then
              print "No Developer ID secrets found; publishing an explicit unsigned prerelease."
              print "FEATHER_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
              print "FEATHER_DISTRIBUTION_MODE=unsigned" >> "$GITHUB_ENV"
              print "signed=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          if (( configured_secret_count != 5 )); then
              print -u2 "Developer ID and notarization secrets must be configured together."
              exit 1
          fi

          keychain_path="$RUNNER_TEMP/feather-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/feather-signing.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          keychain_password=$(/usr/bin/uuidgen)

          print "FEATHER_NOTARY_KEY_PATH=$notary_key_path" >> "$GITHUB_ENV"
          print "FEATHER_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

          print -rn -- "$SIGNING_CERTIFICATE_P12" | /usr/bin/base64 -D > "$certificate_path"
          print -rn -- "$NOTARY_KEY_P8" | /usr/bin/base64 -D > "$notary_key_path"
          /usr/bin/security create-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security set-keychain-settings -lut 21600 "$keychain_path"
          /usr/bin/security unlock-keychain -p "$keychain_password" "$keychain_path"
          /usr/bin/security import "$certificate_path" \
              -k "$keychain_path" \
              -P "$SIGNING_CERTIFICATE_PASSWORD" \
              -T /usr/bin/codesign \
              -T /usr/bin/security
          /usr/bin/security set-key-partition-list \
              -S apple-tool:,apple: \
              -s \
              -k "$keychain_password" \
              "$keychain_path"
          /usr/bin/security list-keychains -d user -s "$keychain_path"

          identity=$(/usr/bin/security find-identity -v -p codesigning "$keychain_path" \
              | /usr/bin/awk -F '"' '/Developer ID Application:/ { print $2; exit }')
          if [[ -z "$identity" ]]; then
              print -u2 "The certificate does not contain a Developer ID Application identity."
              exit 1
          fi

          print "FEATHER_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          print "FEATHER_DISTRIBUTION_MODE=signed" >> "$GITHUB_ENV"
          print "FEATHER_NOTARY_KEY_ID=$NOTARY_KEY_ID" >> "$GITHUB_ENV"
          print "FEATHER_NOTARY_ISSUER_ID=$NOTARY_ISSUER_ID" >> "$GITHUB_ENV"
          print "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run arm64 release checks
        run: ./scripts/check-release.sh

      - name: Notarize application
        if: steps.signing.outputs.signed == 'true'
        run: ./scripts/notarize-app.sh

      - name: Package disk image
        run: ./scripts/package-release.sh

      - name: Publish GitHub release
        shell: zsh {0}
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RELEASE: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          if [[ "$SIGNED_RELEASE" == "true" ]]; then
              print "This build is signed with Developer ID and notarized by Apple." > "$notes"
              prerelease=()
          else
              cat > "$notes" <<'NOTES'
          This is a free, ad-hoc-signed preview build because Developer ID secrets are not configured.

          After the first blocked launch, open **System Settings → Privacy & Security** and choose **Open Anyway**. Do not disable Gatekeeper globally.
          NOTES
              prerelease=(--prerelease)
          fi
          assets=(dist/releases/*.dmg dist/releases/*.sha256)
          gh release create "$GITHUB_REF_NAME" $assets \
              --verify-tag \
              --title "Feather $FEATHER_RELEASE_VERSION" \
              --notes-file "$notes" \
              $prerelease

      - name: Remove signing material
        if: always()
        shell: zsh {0}
        run: |
          if [[ -n "${FEATHER_SIGNING_KEYCHAIN:-}" ]]; then
              /usr/bin/security delete-keychain "$FEATHER_SIGNING_KEYCHAIN" || true
          fi
          /bin/rm -f -- "$RUNNER_TEMP/feather-signing.p12"
          if [[ -n "${FEATHER_NOTARY_KEY_PATH:-}" ]]; then
              /bin/rm -f -- "$FEATHER_NOTARY_KEY_PATH"
          fi
          notary_keys=("$RUNNER_TEMP"/AuthKey_*.p8(N))
          if (( ${#notary_keys} > 0 )); then
              /bin/rm -f -- $notary_keys
          fi
